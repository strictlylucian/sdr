<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConditionalCheckbox · SDR · Propunere independentă</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/portable/sdr.css"><script src="/portable/sdr.js" defer></script><script src="/portable-demo.js" defer></script></head><body class="sdr sdr-u-padding-5"><main><h1 class="sdr-heading-md sdr-u-margin-bottom-5">ConditionalCheckbox · SDR alpha</h1><div lang="ro" data-sdr-theme="light" data-sdr-density="comfortable" class="sdr"><div class="sdr-field-group"><fieldset id="conditional-checkbox" class="sdr-fieldset" aria-describedby="conditional-checkbox-hint"><legend class="sdr-legend">Cum preferi să te contactăm?</legend><div class="sdr-hint" id="conditional-checkbox-hint">Poți alege mai multe opțiuni. Fiecare opțiune selectată afișează câmpul corespunzător.</div><div data-sdr-component="conditional-choice" class="sdr-choice-field"><label class="sdr-choice" for="updates-email"><span class="sdr-choice__control"><input id="updates-email" class="sdr-choice__input" type="checkbox" aria-controls="updates-email-conditional" aria-describedby="conditional-checkbox-hint" name="contact-methods" checked="" value="email"></span><span class="sdr-choice__content"><span id="updates-email-label" class="sdr-choice__label">Email</span></span></label><fieldset id="updates-email-conditional" class="sdr-choice__conditional" data-sdr-conditional="true" aria-labelledby="updates-email-label"><div class="sdr-field sdr-field--error"><label class="sdr-label" for="updates-email-address">Adresa de email</label><div id="updates-email-address-error" class="sdr-error">Introdu adresa de email.</div><input type="email" autocomplete="email" id="updates-email-address" aria-invalid="true" aria-describedby="updates-email-address-error" class="sdr-input" name="email-address"></div></fieldset></div><div data-sdr-component="conditional-choice" class="sdr-choice-field"><label class="sdr-choice" for="updates-phone"><span class="sdr-choice__control"><input id="updates-phone" class="sdr-choice__input" type="checkbox" aria-controls="updates-phone-conditional" aria-describedby="conditional-checkbox-hint" name="contact-methods" value="phone"></span><span class="sdr-choice__content"><span id="updates-phone-label" class="sdr-choice__label">Telefon</span></span></label><fieldset id="updates-phone-conditional" class="sdr-choice__conditional" data-sdr-conditional="true" aria-labelledby="updates-phone-label"><div class="sdr-field"><label class="sdr-label" for="updates-phone-number">Numărul de telefon</label><input type="tel" autocomplete="tel" id="updates-phone-number" class="sdr-input" name="phone-number"></div></fieldset></div></fieldset></div></div></main></body></html>
