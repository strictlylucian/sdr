<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DateInput · SDR · Independent proposal</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/portable/sdr.css"><script src="/portable/sdr.js" defer></script><script src="/portable-demo.js" defer></script></head><body class="sdr sdr-u-padding-5"><main><h1 class="sdr-heading-md sdr-u-margin-bottom-5">DateInput · SDR alpha</h1><div lang="en" data-sdr-theme="light" data-sdr-density="comfortable" class="sdr"><div class="sdr-field-group"><fieldset class="sdr-fieldset" aria-describedby="date-input-hint"><legend class="sdr-legend">Date of birth</legend><p id="date-input-hint" class="sdr-hint">For example, 27 3 1990</p><div class="sdr-date"><div class="sdr-field"><label class="sdr-label" for="date-input-day">Day</label><input inputmode="numeric" autocomplete="bday-day" maxlength="2" id="date-input-day" aria-describedby="date-input-hint" class="sdr-input" name="birth-day"></div><div class="sdr-field"><label class="sdr-label" for="date-input-month">Month</label><input inputmode="numeric" autocomplete="bday-month" maxlength="2" id="date-input-month" aria-describedby="date-input-hint" class="sdr-input" name="birth-month"></div><div class="sdr-field"><label class="sdr-label" for="date-input-year">Year</label><input inputmode="numeric" autocomplete="bday-year" maxlength="4" id="date-input-year" aria-describedby="date-input-hint" class="sdr-input" name="birth-year"></div></div></fieldset></div></div></main></body></html>
