<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConditionalRadio · SDR · Propunere independentă</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/portable/sdr.css"><script src="/portable/sdr.js" defer></script><script src="/portable-demo.js" defer></script></head><body class="sdr sdr-u-padding-5"><main><h1 class="sdr-heading-md sdr-u-margin-bottom-5">ConditionalRadio · SDR alpha</h1><div lang="ro" data-sdr-theme="light" data-sdr-density="comfortable" class="sdr"><div class="sdr-field-group"><fieldset id="conditional-radio" class="sdr-fieldset" aria-describedby="conditional-radio-hint"><legend class="sdr-legend">Cum preferi să te contactăm?</legend><div class="sdr-hint" id="conditional-radio-hint">Alege o singură opțiune. Dacă alegi email sau telefon, apare câmpul corespunzător.</div><div data-sdr-component="conditional-choice" class="sdr-choice-field"><label class="sdr-choice" for="contact-email"><span class="sdr-choice__control"><input id="contact-email" class="sdr-choice__input" type="radio" aria-controls="contact-email-conditional" aria-describedby="conditional-radio-hint" name="contact-method" checked="" value="email"></span><span class="sdr-choice__content"><span id="contact-email-label" class="sdr-choice__label">Email</span></span></label><fieldset id="contact-email-conditional" class="sdr-choice__conditional" data-sdr-conditional="true" aria-labelledby="contact-email-label"><div class="sdr-field sdr-field--error"><label class="sdr-label" for="contact-email-address">Adresa de email</label><div id="contact-email-address-error" class="sdr-error">Introdu adresa de email.</div><input type="email" autocomplete="email" id="contact-email-address" aria-invalid="true" aria-describedby="contact-email-address-error" class="sdr-input" name="email-address"></div></fieldset></div><div data-sdr-component="conditional-choice" class="sdr-choice-field"><label class="sdr-choice" for="contact-phone"><span class="sdr-choice__control"><input id="contact-phone" class="sdr-choice__input" type="radio" aria-controls="contact-phone-conditional" aria-describedby="conditional-radio-hint" name="contact-method" value="phone"></span><span class="sdr-choice__content"><span id="contact-phone-label" class="sdr-choice__label">Telefon</span></span></label><fieldset id="contact-phone-conditional" class="sdr-choice__conditional" data-sdr-conditional="true" aria-labelledby="contact-phone-label"><div class="sdr-field"><label class="sdr-label" for="contact-phone-number">Numărul de telefon</label><input type="tel" autocomplete="tel" id="contact-phone-number" class="sdr-input" name="phone-number"></div></fieldset></div><div class="sdr-choice-field"><label class="sdr-choice" for="contact-post"><span class="sdr-choice__control"><input id="contact-post" class="sdr-choice__input" type="radio" aria-describedby="conditional-radio-hint" name="contact-method" value="post"></span><span class="sdr-choice__content"><span class="sdr-choice__label">Prin poștă</span></span></label></div></fieldset></div></div></main></body></html>
