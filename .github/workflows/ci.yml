name: Verify alpha packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:packages
      - run: node tooling/release/prepare-release.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: component-coverage
          path: coverage/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: alpha-packages
          path: output/release/
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            output/playwright/choice-review/
          if-no-files-found: warn
          retention-days: 14
